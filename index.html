<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Transformer Models - Language Selection</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            /* Specific styles for the landing page to ensure centering and layout */
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                padding: 0;
                text-align: center;
                flex-direction: column;
                background-color: #f8f9fa;
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                overflow: hidden; /* Selection page is a single fixed viewport */
            }
            .selection-container {
                width: 100%;
                max-width: 1200px;
                padding: 20px;
                box-sizing: border-box;
            }
            .main-title {
                font-size: 3.5rem;
                font-weight: 800;
                color: #222;
                margin-bottom: 5rem;
                text-transform: uppercase;
                letter-spacing: -1px;
            }
            .buttons-container {
                display: flex;
                gap: 150px; /* Increased spacing between buttons */
                justify-content: center;
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .lang-column {
                display: flex;
                flex-direction: column;
                align-items: center;
                max-width: 320px;
            }
            .welcome-text {
                font-size: 1.15rem;
                line-height: 1.6;
                margin-bottom: 2.5rem;
                color: #555;
                height: 80px; /* Ensures buttons align even if text lengths differ */
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .lang-button {
                text-decoration: none;
                color: inherit;
                display: flex;
                flex-direction: column;
                align-items: center;
                transition:
                    transform 0.3s ease,
                    opacity 0.3s ease;
            }
            .lang-button:hover {
                transform: scale(1.05);
                opacity: 0.9;
            }
            .image-box {
                width: 280px;
                height: 200px;
                background-color: #eee;
                border-radius: 16px;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            }
            .image-box img {
                width: 100%;
                height: 100%;
                object-fit: contain; /* Using contain to respect icons like internet.png/lion.png */
                padding: 20px;
                box-sizing: border-box;
            }
            .btn-text {
                font-size: 1.6rem;
                font-weight: 700;
                color: #007bff;
                text-transform: uppercase;
                letter-spacing: 2px;
            }

            @media (max-width: 768px) {
                .main-title {
                    font-size: 2.5rem;
                    margin-bottom: 3rem;
                }
                .buttons-container {
                    gap: 60px;
                }
                .welcome-text {
                    display: none;
                    height: auto;
                    margin-bottom: 1.5rem;
                }
                .image-box {
                    width: 220px;
                    height: 160px;
                }
            }
        </style>
    </head>
    <body>
        <div class="selection-container">
            <!-- Big English-only centered title -->
            <h1 class="main-title">How Transformers changed AI</h1>

            <div class="buttons-container">
                <!-- English Column -->
                <div class="lang-column">
                    <p class="welcome-text">
                        Explore how Transformer models revolutionized Artificial
                        Intelligence in English.
                    </p>
                    <a href="content_en.html" class="lang-button">
                        <div class="image-box">
                            <img
                                src="img/internet.png"
                                alt="English language selection icon"
                            />
                        </div>
                        <span class="btn-text">English</span>
                    </a>
                </div>

                <!-- Bulgarian Column -->
                <div class="lang-column">
                    <p class="welcome-text">
                        Разберете как Трансформър моделите революционизираха
                        изкуствения интелект на български.
                    </p>
                    <a href="content_bg.html" class="lang-button">
                        <div class="image-box">
                            <img
                                src="img/lion.png"
                                alt="Избор на български език"
                            />
                        </div>
                        <span class="btn-text">Български</span>
                    </a>
                </div>
            </div>
        </div>
    </body>
</html>
